---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-dev-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-dev
  template:
    metadata:
      labels:
        app: flask-dev
    spec:
      containers:
        - name: flask-dev
          image: flaskdevimage   
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: development
---
apiVersion: v1
kind: Service
metadata:
  name: flask-dev-service
spec:
  type: NodePort
  selector:
    app: flask-dev
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30070
...